<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Umbra PDF</title>
    <style>
      /* Splash: inline so it paints before the app bundle loads. Always dark (brand), matching the Android system splash. */
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px;
        background: #111214; color: #e8e9eb; transition: opacity .3s ease, transform .3s ease, visibility .3s; font: 600 20px/1 system-ui, sans-serif; letter-spacing: .14em; }
      #splash svg { width: 68px; height: 68px; color: #f2b13c; animation: sp-in 1.1s cubic-bezier(.45,0,.2,1) both; }
      #splash span { animation: sp-fade .6s .45s ease both; }
      #splash.out { opacity: 0; visibility: hidden; transform: scale(1.04); }
      #splash { perspective: 600px; }
      @keyframes sp-in { 0% { opacity: 0; transform: scale(.7) rotateY(-360deg); } 40% { opacity: 1; } 100% { transform: scale(1) rotateY(0); } }
      @keyframes sp-fade { from { opacity: 0; transform: translateY(6px); } }
      @media (prefers-reduced-motion: reduce) { #splash svg, #splash span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l6.4 2.4V11c0 4.3-2.7 7.5-6.4 9.1C8.3 18.5 5.6 15.3 5.6 11V5.6z"/><path d="M12 3.2l6.4 2.4V11c0 4.3-2.7 7.5-6.4 9.1z" fill="currentColor"/><path d="M8.2 10h1.9M8.2 12.6h1.9M8.6 15.2h1.5"/></svg>
      <span>UMBRA</span>
    </div>

    <header class="appbar">
      <button id="btn-close" class="round doc-only" aria-label="Close document" title="Close document">
        <svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="brand">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 3.2l6.4 2.4V11c0 4.3-2.7 7.5-6.4 9.1C8.3 18.5 5.6 15.3 5.6 11V5.6z"/><path d="M12 3.2l6.4 2.4V11c0 4.3-2.7 7.5-6.4 9.1z" fill="currentColor"/><path d="M8.2 10h1.9M8.2 12.6h1.9M8.6 15.2h1.5"/></svg>
        <span>Umbra</span>
      </div>
      <span id="docname" class="docname"></span>
      <div class="docacts doc-only" role="group" aria-label="Document actions">
        <button id="btn-find" class="act" disabled title="Find">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Find</span>
        </button>
        <button id="btn-detect" class="act" disabled title="Auto Detect">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="m12 7.5 1.3 3.2 3.2 1.3-3.2 1.3L12 16.5l-1.3-3.2L7.5 12l3.2-1.3z"/></svg>
          <span>Auto Detect</span>
        </button>
        <button id="btn-export" class="act primary" disabled title="Export">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
          <span>Export</span>
        </button>
      </div>
      <button id="btn-settings" class="round home-only" aria-label="Settings" title="Settings">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </header>

    <div class="stage">
      <main id="viewer">
        <div id="empty">
          <svg class="hero" viewBox="0 0 24 24"><path d="M12 3.2l6.4 2.4V11c0 4.3-2.7 7.5-6.4 9.1C8.3 18.5 5.6 15.3 5.6 11V5.6z"/><path d="M12 3.2l6.4 2.4V11c0 4.3-2.7 7.5-6.4 9.1z" fill="currentColor"/><path d="M8.2 10h1.9M8.2 12.6h1.9M8.6 15.2h1.5"/></svg>
          <h1>Redact PDFs, offline</h1>
          <p>Black out anything sensitive, let Umbra spot personal details for you, then save a clean copy. Nothing ever leaves this device.</p>
          <button id="btn-open-2" class="primary big">Open a PDF</button>
        </div>
      </main>
      <aside id="panel" hidden></aside>
      <div id="zoom" class="zoom">
        <button id="zoom-out" aria-label="Zoom out"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button id="zoom-in" aria-label="Zoom in"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
    </div>


    <nav class="dock" aria-label="Tools">
      <div class="seg" role="group" aria-label="Mode">
        <button id="mode-draw" class="tool on" aria-pressed="true">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M3 5h11M3 19h15"/></svg>
          <span>Redact</span>
        </button>
        <button id="mode-pan" class="tool" aria-pressed="false">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>
          <span>Scroll</span>
        </button>
      </div>
      <button id="btn-undo" class="tool" disabled>
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span>Undo</span>
      </button>
      <button id="btn-redo" class="tool" disabled>
        <svg class="ico" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        <span>Redo</span>
      </button>
      <button id="btn-reset" class="tool" disabled>
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>
        <span>Reset</span>
      </button>
    </nav>

    <div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
