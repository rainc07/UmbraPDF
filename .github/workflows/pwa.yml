# iPhone/iPad web app (installable, works offline): built from core/ into core/dist-pwa, tested in WebKit (Safari's
# engine), Chromium and Firefox at iPhone size, and published to GitHub Pages from main.
# Live at https://rainc07.github.io/UmbraPDF/
name: iPhone web app

on:
  push:
    branches: ['**']
    paths: ['core/**', 'samples/**', '.github/workflows/pwa.yml']
  pull_request:
    paths: ['core/**', 'samples/**', '.github/workflows/pwa.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test (WebKit, Chromium, Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Build
        working-directory: core
        run: npm ci && npm run build:pwa
      - name: Browsers
        working-directory: core
        run: npx playwright-core install --with-deps webkit chromium firefox
      - name: Test in WebKit (Safari engine), iPhone 15
        working-directory: core
        run: SHOTS=shots node tests/pwa.mjs webkit
      - name: Test in Chromium, iPhone 15
        if: success() || failure()
        working-directory: core
        run: SHOTS=shots node tests/pwa.mjs chromium
      - name: Test in Firefox, iPhone-sized window
        if: success() || failure()
        working-directory: core
        run: SHOTS=shots node tests/pwa.mjs firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-screenshots
          path: core/shots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: core/dist-pwa

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
